name: CI Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx1024m'

jobs:

  # ============================================
  # Job 1: Test
  # ============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'          # cache .m2 automatically

      - name: Run unit tests
        run: mvn test -q

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()              # upload even if tests fail
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  # ============================================
  # Job 2: Code Quality
  # ============================================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: test               # only run if test passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Check code style
        run: |
          echo "Running code quality checks..."
          mvn validate -q
          echo "✅ Code quality passed"

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          # Check for common secret patterns
          if grep -r \
            "password\s*=\s*['\"][^'\"]\+" \
            src/ --include="*.java" -i; then
            echo "❌ Hardcoded password found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

  # ============================================
  # Job 3: Build JAR
  # ============================================
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: [test, code-quality]  # needs both to pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: mvn clean package -DskipTests -q

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar-${{ github.sha }}
          path: target/*.jar
          retention-days: 30

      - name: Print build info
        run: |
          echo "================================================"
          echo "Build Information"
          echo "================================================"
          echo "Commit:    ${{ github.sha }}"
          echo "Branch:    ${{ github.ref_name }}"
          echo "Actor:     ${{ github.actor }}"
          echo "Timestamp: $(date -u)"
          echo "JAR size:  $(du -sh target/*.jar | cut -f1)"
          echo "================================================"
