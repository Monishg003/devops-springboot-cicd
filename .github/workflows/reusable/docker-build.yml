name: Reusable — Docker Build

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: 'latest'
      dockerfile:
        required: false
        type: string
        default: 'docker/Dockerfile'
      push:
        required: false
        type: boolean
        default: false
      scan:
        required: false
        type: boolean
        default: true

    secrets:
      registry-token:
        required: false

    outputs:
      image-tag:
        description: 'Full image tag'
        value: ${{ jobs.docker.outputs.image-tag }}
      scan-result:
        description: 'Security scan result'
        value: ${{ jobs.docker.outputs.scan-result }}

jobs:

  docker:
    name: Docker Build${{ inputs.push && ' + Push' || '' }}
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      scan-result: ${{ steps.scan.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java for build
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: mvn clean package -DskipTests -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.image-name }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to registry
        if: inputs.push == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.registry-token || secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: ${{ inputs.push && '' || 'type=docker,dest=/tmp/image.tar' }}

      - name: Security scan
        id: scan
        if: inputs.scan == true
        uses: aquasecurity/trivy-action@master
        with:
          input: ${{ inputs.push && '' || '/tmp/image.tar' }}
          image-ref: ${{ inputs.push && steps.meta.outputs.tags || '' }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
